<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audio Threat Detection</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
    <div class="container">
        <h1>🔊 Audio Threat Detection</h1>
        <p>Upload an audio file to analyze its content and determine if it contains any threats.</p>
        
        <form id="uploadForm" enctype="multipart/form-data">
            <label for="audioFile" class="file-label">🎵 Select an Audio File</label>
            <input type="file" id="audioFile" name="file" accept="audio/*" required class="custom-file-input">
            <button type="submit" id="uploadBtn" class="upload-btn">🚀 Upload & Analyze</button>
        </form>
        
        <audio id="audioPlayer" controls></audio>
        
        <div class="output-container">
            <div class="output-box">
                <h3>📝 Transcription:</h3>
                <p id="transcription">Awaiting transcription...</p>
            </div>
            <div class="output-box">
                <h3>⚠️ Threat Status:</h3>
                <p id="threatStatus">Awaiting analysis...</p>
            </div>
        </div>
    </div>
    
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
